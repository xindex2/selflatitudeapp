# Alternative: nginx installed directly on the server (no Docker for nginx).
# The Node API runs on 127.0.0.1:4000 (pm2 or systemd, see docs/DEPLOY.md) and
# nginx serves the built client from client/dist directly.

server {
    listen 80;
    server_name companion.selflatitude.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name companion.selflatitude.com;

    ssl_certificate     /etc/letsencrypt/live/companion.selflatitude.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/companion.selflatitude.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    client_max_body_size 45m;

    root /var/www/selflatitude-companion/client/dist;
    index index.html;

    location ~ ^/api/(conversations/[^/]+/(messages|regenerate)|admin/companion/preview)$ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
