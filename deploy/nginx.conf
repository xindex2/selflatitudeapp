# SelfLatitude Companion - nginx reverse proxy
# Replace companion.selflatitude.com with the real hostname.

upstream companion_app {
    server app:4000;
    keepalive 16;
}

# Slow down credential guessing at the edge as well as in the app.
# (Must sit in the http context, which is where conf.d files are included.)
limit_req_zone $binary_remote_addr zone=companion_auth:10m rate=20r/m;

# Refuse requests for any other host name, so the app only ever sees its own.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    return 444;
}

server {
    listen 80;
    server_name companion.selflatitude.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name companion.selflatitude.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 45m;            # course file uploads

    # Keep private content out of access logs: log method/path/status only.
    log_format companion '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent';
    access_log /var/log/nginx/companion.access.log companion;

    # Sign-in and password endpoints: rate limited at the edge.
    location ~ ^/api/auth/(login|register|forgot|reset|one-time|mfa)$ {
        limit_req zone=companion_auth burst=10 nodelay;
        proxy_pass http://companion_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Payment notifications from JVZoo. Add JVZoo's published addresses here before launch.
    location = /api/webhooks/jvzoo {
        # allow 1.2.3.4;
        # deny all;
        proxy_pass http://companion_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Streaming chat (Server-Sent Events): no buffering, long timeouts.
    location ~ ^/api/(conversations/[^/]+/(messages|regenerate)|admin/companion/preview)$ {
        proxy_pass http://companion_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://companion_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Everything else: the built React app (served by the API container's static handler).
    location / {
        proxy_pass http://companion_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
